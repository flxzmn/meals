[project]
name = "meal-mcp"
version = "1.2.1"
description = "Local MCP server for recipes, USDA nutrition and a learning substitution knowledge base."
requires-python = ">=3.11"
# Runtime dependencies. The uv bundle (MCPB server type "uv") installs exactly these.
dependencies = [
    "fastmcp>=4.1,<5",
    "sqlalchemy>=2.0,<3",
    "httpx>=0.27,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
]

# No package build: main.py is run directly ("uv run main.py").
[tool.uv]
package = false
